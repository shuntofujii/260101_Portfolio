name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Meta audit
        run: node meta-audit.js

      - name: Build project pages
        run: node scripts/build-project-pages.mjs

      - name: Prepare Pages artifact
        run: |
          mkdir -p _site
          rsync -a \
            --exclude '_site' \
            --exclude 'node_modules' \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.env' \
            --exclude '.env.*' \
            --exclude 'coverage' \
            --exclude '.vite' \
            --exclude 'tests' \
            --exclude 'scripts' \
            --exclude 'package.json' \
            --exclude 'package-lock.json' \
            --exclude 'meta-audit.js' \
            --exclude 'SEO_RECOMMENDATIONS.md' \
            --exclude 'README.md' \
            --exclude 'docs' \
            --exclude '.DS_Store' \
            --exclude '.gitignore' \
            ./ _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
